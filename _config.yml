title: "Biblioteca Digital - Abdiel"
description: "Documentación y portafolio personal"
baseurl: ""
url: "https://abdielgv162.github.io"

# Tema base
#theme: jekyll-theme-cayman

# Configuración de sintaxis
markdown: kramdown
highlighter: rouge
kramdown:
  input: GFM
  syntax_highlighter: rouge
  syntax_highlighter_opts:
    css_class: 'highlight'
    default_lang: 'text'

# Sass configuration
sass:
  sass_dir: assets/css

# Incluir CSS personalizado
include:
  - assets/css

# Plugins
plugins:
  - jekyll-feed
  - jekyll-seo-tag

# Información personal
github_username: abdielgv162