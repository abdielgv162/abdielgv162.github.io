<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>{{ page.title }} - {{ site.title }}</title>

  <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">

  <!-- Prism -->
   <!-- Prism theme -->
  <link href="https://cdn.jsdelivr.net/npm/prismjs@1.29.0/themes/prism-tomorrow.min.css" rel="stylesheet">

  <!-- Prism core -->
  <script defer src="https://cdn.jsdelivr.net/npm/prismjs@1.29.0/prism.min.js"></script>

  <!-- Toolbar (OBLIGATORIO) -->
  <link href="https://cdn.jsdelivr.net/npm/prismjs@1.29.0/plugins/toolbar/prism-toolbar.min.css" rel="stylesheet">
  <script defer src="https://cdn.jsdelivr.net/npm/prismjs@1.29.0/plugins/toolbar/prism-toolbar.min.js"></script>

  <!-- Copy button -->
  <script defer src="https://cdn.jsdelivr.net/npm/prismjs@1.29.0/plugins/copy-to-clipboard/prism-copy-to-clipboard.min.js"></script>

<!-- KaTeX -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.17.0/dist/katex.min.css">
  <script defer src="https://cdn.jsdelivr.net/npm/katex@0.17.0/dist/katex.min.js"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/katex@0.17.0/dist/contrib/auto-render.min.js"
    onload="renderMathInElement(document.body, {
      delimiters: [
        {left: '$$', right: '$$', display: true},
        {left: '$', right: '$', display: false}
      ]
    });"></script>
</head>

<body>

<header class="site-header">
  <nav>
    <ul>
      {% for item in site.data.navigation %}
        <li>
          <a href="{{ item.url | relative_url }}"
   {% if page.url contains item.url %}class="active"{% endif %}>
  {{ item.title }}
</a>
        </li>
      {% endfor %}
    </ul>
  </nav>
</header>

<main class="site-content">
  {{ content }}
</main>

<footer class="site-footer">
  <p>© {{ site.time | date: "%Y" }} {{ site.title }}</p>
</footer>

<script src="{{ '/assets/js/copy.js' | relative_url }}"></script>

</body>
</html>
