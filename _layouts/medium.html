<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>{{ page.title }} - {{ site.title }}</title>
    <link rel="stylesheet" href="{{ '/assets/css/dark-theme.css' | relative_url }}">
</head>
<body>
    <header class="site-header">
        <div class="container">
            <h1 class="site-title">
                <a href="{{ '/' | relative_url }}">{{ site.title }}</a>
            </h1>
            <nav class="site-nav">
                <a href="{{ '/' | relative_url }}">Inicio</a>
                <a href="{{ '/blog/' | relative_url }}">Blog</a>
                <a href="{{ '/docs/' | relative_url }}">Documentación</a>
            </nav>
        </div>
    </header>

    <main class="container">
        <article class="medium-article">
            <header class="article-header">
                <h1>{{ page.title }}</h1>
                {% if page.subtitle %}
                <h2 class="subtitle">{{ page.subtitle }}</h2>
                {% endif %}
                <div class="article-meta">
                    <time datetime="{{ page.date }}">{{ page.date | date: "%B %d, %Y" }}</time>
                </div>
            </header>

            <div class="article-content">
                {{ content }}
            </div>
        </article>
    </main>
</body>
</html>
